name: 공개 전 점검

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 커밋 기록 전체를 검사하기 위해

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 금지 경로, 비밀 정보, 금지 열 (원문 조각 대조는 원문이 있는 내 PC에서만)
      - name: 공개 파일 점검
        run: python scripts/check_public.py

      # 지금 파일뿐 아니라 지난 커밋 기록 전체에서 비밀 정보 검사
      - name: 커밋 기록 비밀 정보 검사 (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
